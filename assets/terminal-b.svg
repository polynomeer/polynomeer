<svg xmlns="http://www.w3.org/2000/svg" width="680" height="360" viewBox="0 0 680 360">
  <defs>
    <clipPath id="frame-clip">
      <rect x="0" y="0" width="680" height="360" rx="10" ry="10"/>
    </clipPath>
  </defs>
  <g clip-path="url(#frame-clip)">
    <!-- body -->
    <rect x="0" y="0" width="680" height="360" fill="#0d1117"/>
    <!-- chrome bar -->
    <rect x="0" y="0" width="680" height="32" fill="#161b22"/>
    <line x1="0" y1="32" x2="680" y2="32" stroke="#30363d" stroke-width="1"/>
    <!-- traffic lights -->
    <circle cx="20" cy="16" r="6" fill="#ff5f56"/>
    <circle cx="40" cy="16" r="6" fill="#ffbd2e"/>
    <circle cx="60" cy="16" r="6" fill="#27c93f"/>
    <!-- url -->
    <text x="340" y="20" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#8b949e">github.com/polynomeer</text>
  </g>
  <!-- border -->
  <rect x="0.5" y="0.5" width="679" height="359" rx="10" ry="10" fill="none" stroke="#30363d" stroke-width="1"/>

  <!-- body text -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14.5">
    <text x="24" y="60" fill="#7ee787">$ whoami</text>
    <text x="24" y="86" fill="#e6edf3">polynomeer — backend engineer</text>

    <text x="24" y="122" fill="#7ee787">$ cat motto.txt</text>
    <text x="24" y="148" fill="#e6edf3" font-weight="bold">Make Non-Polynomial Polynomial.</text>

    <text x="24" y="184" fill="#7ee787">$ neofetch --github</text>
    <text x="24" y="210" fill="#7ee787" font-weight="bold">polynomeer@github</text>
    <text x="24" y="230" fill="#6e7681">-----------------</text>
    <text x="24" y="254" fill="#e6edf3"><tspan fill="#7ee787">Role</tspan>       backend engineer</text>
    <text x="24" y="278" fill="#e6edf3"><tspan fill="#7ee787">Focus</tspan>      state machines, locks, transaction boundaries</text>

    <text x="24" y="314" fill="#7ee787">$ echo $INTERESTS</text>
    <text x="24" y="338" fill="#e6edf3">concurrency, Redis internals, someday my own product</text>
  </g>
</svg>
